<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#0f2447"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52adc8"/>
      <stop offset="100%" stop-color="#3d8fa8"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Edges connecting nodes -->
  <line x1="32" y1="14" x2="16" y2="38" stroke="#52adc8" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="32" y1="14" x2="48" y2="38" stroke="#52adc8" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="16" y1="38" x2="48" y2="38" stroke="#52adc8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Edges to center node -->
  <line x1="32" y1="14" x2="32" y2="30" stroke="#52adc8" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="16" y1="38" x2="32" y2="30" stroke="#52adc8" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="48" y1="38" x2="32" y2="30" stroke="#52adc8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Outer edges to secondary nodes -->
  <line x1="32" y1="14" x2="20" y2="20" stroke="#52adc8" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="32" y1="14" x2="44" y2="20" stroke="#52adc8" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="16" y1="38" x2="14" y2="50" stroke="#52adc8" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="48" y1="38" x2="50" y2="50" stroke="#52adc8" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Secondary (smaller) nodes -->
  <circle cx="20" cy="20" r="2.5" fill="#3d8fa8" opacity="0.7"/>
  <circle cx="44" cy="20" r="2.5" fill="#3d8fa8" opacity="0.7"/>
  <circle cx="14" cy="50" r="2.5" fill="#3d8fa8" opacity="0.7"/>
  <circle cx="50" cy="50" r="2.5" fill="#3d8fa8" opacity="0.7"/>
  <!-- Center node (hub) -->
  <circle cx="32" cy="30" r="4" fill="url(#accent)"/>
  <circle cx="32" cy="30" r="2" fill="#fff" opacity="0.6"/>
  <!-- Primary nodes with glow -->
  <circle cx="32" cy="14" r="5.5" fill="url(#accent)"/>
  <circle cx="32" cy="14" r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="16" cy="38" r="5.5" fill="url(#accent)"/>
  <circle cx="16" cy="38" r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="48" cy="38" r="5.5" fill="url(#accent)"/>
  <circle cx="48" cy="38" r="2.5" fill="#fff" opacity="0.7"/>
</svg>
